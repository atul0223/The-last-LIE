name: CI

on:
  push:
    branches:
      - main
      - 'wp/**'
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Check, Test & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope review
        if: github.ref != 'refs/heads/main'
        run: |
          git diff --name-only origin/main...HEAD || true

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build engine bundle
        run: pnpm build:engine

      - name: Deno check Edge Functions
        run: deno check supabase/functions/api/index.ts

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test & Coverage Gate
        run: |
          pnpm -r test
          pnpm test:api
          pnpm --filter @lastlie/case-engine test -- --coverage

      - name: Content validation
        run: pnpm lastlie validate "packages/content/cases/**/case_*.json"

      - name: Dependency audit (critical)
        run: pnpm audit --audit-level=critical

  db-integration:
    name: Database & RLS Integration
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (Docker)
        run: supabase start

      - name: Reset Database and Apply Migrations & Seed
        run: supabase db reset

      - name: Test Database RLS & Schema (pgTAP)
        run: supabase test db

      - name: Run API tests against local Supabase
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4Mzg3OTYwMH0.local_service_role_key
          USE_LOCAL_DB: 'true'
        run: pnpm test:api

  preview-build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    needs: [check, db-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check EXPO_TOKEN and build preview
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice ::EXPO_TOKEN is not configured in repository secrets. Skipping EAS preview build."
            exit 0
          fi
          echo "EXPO_TOKEN found. Setting up EAS and running preview build..."
          pnpm dlx eas-cli build --profile preview --platform all --non-interactive

